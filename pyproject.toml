[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "can-bench-lab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "matplotlib>=3.9,<4"]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "gcovr>=8,<9"]
[project.scripts]
canbench = "canbench.cli:main"
[tool.setuptools.packages.find]
where = ["python"]
[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--cov=canbench --cov-report=xml:artifacts/python-coverage.xml --cov-report=html:artifacts/python-html --junitxml=artifacts/pytest.xml"
[tool.coverage.run]
branch = true
source = ["canbench"]
