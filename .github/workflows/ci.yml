name: CAN bench CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Prepare runner tools
        run: |
          mkdir -p artifacts/c-html
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-tidy
          python -m pip install '.[test]'
      - name: Configure and build with warnings as errors
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCB_COVERAGE=ON
          cmake --build build --parallel 2
      - name: Run C Unity cases
        run: ctest --test-dir build --verbose | tee artifacts/ctest.log
      - name: Static analysis with cppcheck
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c11 --suppress=missingIncludeSystem -Iinclude core backends app 2>&1 | tee artifacts/cppcheck.log
      - name: Static analysis with clang-tidy
        run: |
          for source in core/*.c backends/*.c app/*.c; do
            clang-tidy --quiet -p build "$source" --warnings-as-errors='*'
          done 2>&1 | tee artifacts/clang-tidy.log
      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCB_SANITIZERS=ON
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --verbose | tee artifacts/sanitizers.log
      - name: Attempt vcan0 and record fallback if needed
        run: python ci/setup_bus.py
      - name: Test Python tools and process bench on selected buses
        run: python -m pytest -v
      - name: Measure C core coverage and enforce 80 percent
        run: gcovr build --root . --filter core/ --xml-pretty --output artifacts/c-coverage.xml --html-details artifacts/c-html/index.html --print-summary --fail-under-line 80
      - name: Analyze fault capture and actual bench log
        run: python ci/analyze_runs.py
      - name: Report measured test counts and coverage
        run: python ci/measure.py
      - name: Record runner package versions
        if: always()
        run: python -m pip freeze > artifacts/python-dependencies.txt
      - name: Upload logs, plot, diagnosis, and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: can-bench-results
          path: artifacts/
          if-no-files-found: error
